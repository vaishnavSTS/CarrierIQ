[project]
name = "carriersafetyscan-backend"
version = "0.1.0"
description = "Carrier Intelligence Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "cryptography>=42.0",
    "httpx>=0.28",
    "pyjwt>=2.9",
    "boto3>=1.35",  # DataQs evidence files: Supabase Storage over the S3 protocol
    "python-multipart>=0.0.12",  # file uploads (DataQs evidence)
    "openpyxl>=3.1",  # Excel downloads (High ISS list)
    "reportlab>=4.2",  # invoice PDFs (emailed when paid)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1",
    "types-reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PLE"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
