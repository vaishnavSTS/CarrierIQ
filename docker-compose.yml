services:
  # Optional local PostgreSQL. Not started by default (we use Supabase);
  # run `docker compose --profile localdb up` to use it instead.
  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carrieriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carrieriq}
      POSTGRES_DB: ${POSTGRES_DB:-carrieriq}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carrieriq} -d ${POSTGRES_DB:-carrieriq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Settings come from backend/.env, the same file local (venv) runs use: database, Socrata
  # token, Google sign-in. Jobs run in the worker container below, not inside the API.
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      RUN_WORKER_IN_API: "false"
    ports:
      - "8000:8000"
    # Healthy once migrations have run and the API answers (startup takes a few seconds).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30

  # Background worker (spec Section 18): runs queued jobs and refreshes stale carriers on a
  # schedule. Same image as the backend; starts after it so migrations have been applied.
  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.worker"]
    env_file: ./backend/.env
    environment:
      RUN_WORKER_IN_API: "false"
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
