# Render Blueprint for the CarrierSafetyScan API (demo setup: free plan, no background worker).
# The frontend is on Vercel and reaches this service through the /api rewrite in
# frontend/vercel.json, so the session cookie stays on the frontend's domain.
services:
  - type: web
    name: carrieriq-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true # redeploy on every push to main (the frontend on Vercel does the same)
    envVars:
      - key: ENVIRONMENT
        value: production # HTTPS-only cookies; refuses to start with the development key
      - key: RUN_WORKER_IN_API
        value: "false" # no background worker in the demo
      # Serve stored carrier data as it is (about 100 years before data counts as old).
      # Carriers not yet in the database still load live from FMCSA when searched.
      # Remove this, or set 24, to refresh carriers older than a day when they are opened.
      - key: CARRIER_REFRESH_HOURS
        value: "876000"
      # Clients see only their own carriers, with no search. "true" lets them search and open
      # any carrier (used for STS team testing).
      - key: CLIENT_SEARCH_ENABLED
        value: "false"
      - key: AUTH_SECRET_KEY
        generateValue: true
      # Set these in the Render dashboard; they are never stored in the repo.
      - key: DATABASE_URL
        sync: false # Supabase session-pooler URL, as in backend/.env
      - key: SOCRATA_APP_TOKEN
        sync: false
      - key: QCMOBILE_WEB_KEY
        sync: false # FMCSA QCMobile WebKey: carriers' EIN (Identity, Chameleon check)
      # DataQs evidence files: Supabase Storage → S3 Configuration (private bucket dataqs-evidence)
      - key: DATAQS_STORAGE_ENDPOINT
        sync: false
      - key: DATAQS_STORAGE_REGION
        sync: false
      - key: DATAQS_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: DATAQS_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: DATAQS_STORAGE_BUCKET
        value: dataqs-evidence
      # DataQs emails: through the Gmail API when the three GMAIL_* are set (HTTPS: works on
      # the free plan, which blocks SMTP), else over SMTP when SMTP_HOST is set, else through
      # Resend (RESEND_API_KEY). No email is sent until one of them is set.
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false # from python -m app.workers.gmail_authorize
      - key: SMTP_HOST
        sync: false # e.g. smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false # the mailbox, e.g. dataqs@skytransportsolutions.com
      - key: SMTP_PASSWORD
        sync: false # Google: an App Password, never the account password
      - key: RESEND_API_KEY
        sync: false
      - key: DATAQS_EMAIL_FROM
        sync: false # e.g. Sky Transport Solutions <dataqs@skytransportsolutions.com>
      - key: DATAQS_EMAIL_REPLY_TO
        value: vaishnav@skytransportsolutions.com
      # While testing: every carrier email to Wesley, every STS staff email to Vaishnav.
      # Delete these two to email the real carrier users and STS staff.
      - key: DATAQS_EMAIL_CARRIER_OVERRIDE
        value: wesley@skytransportsolutions.com
      - key: DATAQS_EMAIL_STAFF_OVERRIDE
        value: vaishnav@skytransportsolutions.com
      - key: PUBLIC_APP_URL
        sync: false # the frontend's address, for links in emails
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # https://<your-vercel-domain>/api/v1/auth/google/callback
