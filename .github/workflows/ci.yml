# The same checks run locally before a commit (README). Runs only when started by hand
# (GitHub > Actions > CI > Run workflow), never on push. Nothing is deployed; no secrets.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: carrieriq
          POSTGRES_PASSWORD: carrieriq
          POSTGRES_DB: carrieriq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carrieriq -d carrieriq"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://carrieriq:carrieriq@localhost:5432/carrieriq
      TEST_DATABASE_URL: postgresql+psycopg://carrieriq:carrieriq@localhost:5432/carrieriq
      RUN_WORKER_IN_API: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # same as backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Migrations apply to an empty database
        run: alembic upgrade head
      - name: Tests (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Format (prettier)
        run: npx prettier --check src
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check and build
        run: npm run build
